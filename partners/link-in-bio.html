<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding Partner | Moonshine Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 500: '#00F0FF', 900: '#003B45' }, dark: { 900: '#050505', 800: '#0A0A0A' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .link-card { transition: all 0.2s ease; }
        .link-card:hover { transform: translateY(-2px); border-color: #00F0FF; background: rgba(0, 240, 255, 0.05); }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Glow -->
    <div class="fixed top-[-10%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-brand-900/30 blur-[100px] pointer-events-none z-0"></div>

    <main class="w-full max-w-md relative z-10 py-12">
        <!-- Profile Section -->
        <div class="text-center mb-8">
            <div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-tr from-brand-500 to-dark-900 mb-4">
                <img src="https://i.pravatar.cc/150?img=11" alt="Partner Profile" class="w-full h-full rounded-full border-4 border-dark-900 object-cover">
            </div>
            <h1 class="font-display text-2xl font-bold tracking-tight">Jason Feimster</h1>
            <p class="text-gray-400 text-sm font-mono mt-1 uppercase tracking-widest">Alpha Node Partner</p>
            <div class="mt-4 inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel text-[10px] font-bold text-brand-500 uppercase tracking-widest border-brand-500/30">
                <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span>
                Moonshine Capital Network
            </div>
        </div>

        <!-- Links Section -->
        <div class="space-y-4">
            <a href="fund-match-quiz.html" class="link-card glass-panel block p-4 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white group-hover:text-brand-500 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">Funding Match Quiz</h2>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-0.5">Find Your Capital Path</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-gray-600 group-hover:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="startup-planner.html" class="link-card glass-panel block p-4 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white group-hover:text-brand-500 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">0% Startup Pre-Check</h2>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-0.5">For New Founders</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-gray-600 group-hover:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <a href="dscr-precheck.html" class="link-card glass-panel block p-4 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white group-hover:text-brand-500 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">Real Estate DSCR Tool</h2>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-0.5">Analyze Rental Deals</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-gray-600 group-hover:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
            
            <a href="index.html#apply" class="mt-8 block w-full bg-white text-dark-900 py-4 rounded-2xl text-center font-bold text-sm uppercase tracking-widest hover:bg-brand-500 transition-colors">
                Apply for Funding
            </a>
        </div>
    </main>
</body>
</html>
