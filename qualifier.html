<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Collar Banker Qualifier | FundStack-AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: { 500: '#00F0FF', 900: '#003B45' },
                        dark: { 900: '#050505', 800: '#0A0A0A', 700: '#111111' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
        .step-inactive { opacity: 0.3; pointer-events: none; }
        .grade-a { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .grade-b { color: #eab308; }
        .grade-f { color: #ef4444; }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 border-b border-white/5 bg-dark-900/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="font-display font-bold text-xl tracking-tight flex items-center gap-2">
                <div class="w-3 h-3 bg-brand-500 rounded-full"></div>
                FUNDSTACK<span class="text-brand-500">AI</span>
            </a>
            <div class="flex gap-6 text-[11px] font-bold uppercase tracking-widest text-gray-500">
                <a href="guide.html" class="hover:text-brand-500 transition-colors">Success Guide</a>
                <a href="products.html" class="hover:text-brand-500 transition-colors">Product Matrix</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-6 max-w-3xl mx-auto">
        <div class="mb-12 text-center">
            <h1 class="font-display text-4xl font-bold mb-4 uppercase tracking-tighter">Blue Collar Banker</h1>
            <p class="text-gray-500 font-mono text-xs uppercase tracking-[0.2em]">High-Precision Lead Qualification Engine</p>
        </div>

        <!-- Qualifier Tool -->
        <div id="qualifierTool" class="glass-panel p-8 md:p-12 rounded-[2.5rem] border-white/10 shadow-2xl">
            <div id="step1">
                <h3 class="font-display text-xl font-bold mb-8 flex items-center gap-4">
                    <span class="w-8 h-8 rounded-full bg-brand-500 text-dark-900 flex items-center justify-center text-sm">1</span>
                    Revenue & Cash Flow
                </h3>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-3">Avg Monthly Bank Deposits</label>
                        <select id="revInput" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none focus:border-brand-500 transition-all">
                            <option value="0">Less than $10,000</option>
                            <option value="15000" selected>$15,000 - $30,000</option>
                            <option value="50000">$30,000 - $100,000</option>
                            <option value="150000">$100,000+</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-3">Time in Business</label>
                        <select id="tibInput" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none focus:border-brand-500 transition-all">
                            <option value="0">Startup (0-6 months)</option>
                            <option value="12">6 - 24 months</option>
                            <option value="24" selected>2+ Years</option>
                        </select>
                    </div>
                    <button onclick="nextStep(2)" class="w-full bg-brand-500 text-dark-900 py-4 rounded-xl font-bold uppercase text-sm mt-4 hover:bg-white transition-all">Next Component</button>
                </div>
            </div>

            <div id="step2" class="hidden">
                <h3 class="font-display text-xl font-bold mb-8 flex items-center gap-4">
                    <span class="w-8 h-8 rounded-full bg-brand-500 text-dark-900 flex items-center justify-center text-sm">2</span>
                    Credit & Compliance
                </h3>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-3">Estimated FICO Score</label>
                        <select id="ficoInput" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none focus:border-brand-500 transition-all">
                            <option value="550">Subprime (500-600)</option>
                            <option value="640">Fair (600-680)</option>
                            <option value="720" selected>Good (680+)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-3">Collateral Available?</label>
                        <select id="collateralInput" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none focus:border-brand-500 transition-all">
                            <option value="none">No (Unsecured)</option>
                            <option value="re">Real Estate (Residential/Commercial)</option>
                            <option value="equipment">Heavy Equipment / Vehicles</option>
                        </select>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="nextStep(1)" class="w-1/3 bg-white/5 text-white py-4 rounded-xl font-bold uppercase text-sm">Back</button>
                        <button onclick="calculateGrade()" class="w-2/3 bg-brand-500 text-dark-900 py-4 rounded-xl font-bold uppercase text-sm hover:bg-white transition-all">Generate Grade</button>
                    </div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result" class="hidden text-center">
                <div id="gradeChar" class="font-display text-9xl font-black mb-4">A</div>
                <h2 id="gradeTitle" class="text-2xl font-bold mb-2">Tier-1 Fundable</h2>
                <p id="gradeDesc" class="text-gray-400 text-sm mb-8 px-6">This file is a high-priority submission. Multiple capital paths available.</p>
                
                <div class="bg-dark-900 p-6 rounded-2xl border border-white/5 text-left mb-8">
                    <h4 class="text-[10px] font-bold text-brand-500 uppercase tracking-widest mb-4">Recommended Routing</h4>
                    <ul id="routingList" class="space-y-2 text-sm text-gray-300">
                        <!-- Routing injected here -->
                    </ul>
                </div>

                <a href="index.html#apply" class="block w-full bg-white text-dark-900 py-4 rounded-xl font-bold uppercase text-sm">Submit To Deal Desk</a>
                <button onclick="location.reload()" class="mt-4 text-xs font-bold text-gray-500 uppercase tracking-widest hover:text-white">Restart Audit</button>
            </div>
        </div>
    </main>

    <script>
        function nextStep(n) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('step' + n).classList.remove('hidden');
        }

        function calculateGrade() {
            const rev = parseInt(document.getElementById('revInput').value);
            const tib = parseInt(document.getElementById('tibInput').value);
            const fico = parseInt(document.getElementById('ficoInput').value);
            const collateral = document.getElementById('collateralInput').value;

            let score = 0;
            if (rev >= 15000) score += 2;
            if (rev >= 50000) score += 1;
            if (tib >= 24) score += 2;
            if (fico >= 680) score += 2;
            if (collateral !== 'none') score += 2;

            const gradeChar = document.getElementById('gradeChar');
            const gradeTitle = document.getElementById('gradeTitle');
            const gradeDesc = document.getElementById('gradeDesc');
            const routingList = document.getElementById('routingList');
            const result = document.getElementById('result');

            nextStep('result');
            result.classList.remove('hidden');
            routingList.innerHTML = '';

            if (score >= 7) {
                gradeChar.innerText = 'A';
                gradeChar.className = 'font-display text-9xl font-black mb-4 grade-a';
                gradeTitle.innerText = 'Institutional Grade';
                gradeDesc.innerText = 'High probability of funding via Term Loans or Unsecured Lines. Priority Deal Desk routing.';
                routingList.innerHTML = '<li>• Unsecured Line Stacking</li><li>• SBA 7(a) Express</li><li>• Monthly Term Loan</li>';
            } else if (score >= 4) {
                gradeChar.innerText = 'B';
                gradeChar.className = 'font-display text-9xl font-black mb-4 grade-b';
                gradeTitle.innerText = 'Alternative Match';
                gradeDesc.innerText = 'Client is likely a fit for Revenue-Based Advances or Asset-Backed Bridge loans.';
                routingList.innerHTML = '<li>• Revenue Based Advance</li><li>• Equipment Lease Back</li><li>• Merchant Cash Advance</li>';
            } else {
                gradeChar.innerText = 'F';
                gradeChar.className = 'font-display text-9xl font-black mb-4 grade-f';
                gradeTitle.innerText = 'High Risk / Pre-Fundable';
                gradeDesc.innerText = 'File contains significant disqualifiers. Pivot to Credit Builder path or Asset-Backed conversion.';
                routingList.innerHTML = '<li>• Business Credit Builder</li><li>• Asset-Backed Hard Money</li>';
            }
        }
    </script>
</body>
</html>
