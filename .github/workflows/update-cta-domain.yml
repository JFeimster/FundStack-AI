name: Update FundStack CTA canonical domain

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-cta-domain.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical domain and remove helper
        run: |
          python -c "from pathlib import Path; p=Path('data/cta-routing.json'); t=p.read_text(); p.write_text(t.replace('https://fundstack-ai.vercel.app','https://fundstack.distilledfunding.com'))"
          rm .github/workflows/update-cta-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move CTA routing metadata to Cloudflare canonical domain"
          git push
