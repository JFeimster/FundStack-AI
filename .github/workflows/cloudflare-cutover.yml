## 8. Legacy Vercel

- [ ] `vercel.json` still disables automatic Vercel Git deployments.
- [ ] No new public links use `fundstack-ai.vercel.app`.
- [ ] Retire the legacy Vercel project after the Cloudflare custom domain is active.
''', encoding='utf-8')

          # Add Cloudflare-native canonical Link headers for the known public routes.
          headers = Path('_headers')
          base = headers.read_text(encoding='utf-8').rstrip() + '\n\n'
          marker = '# Canonical production URLs\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip() + '\n\n'
          canonical_routes = [
              ('/', '/'),
              ('/index.html', '/'),
              ('/partners/index.html', '/partners/index.html'),
              ('/partners/assets.html', '/partners/assets.html'),
              ('/partners/guide.html', '/partners/guide.html'),
              ('/partners/link-in-bio.html', '/partners/link-in-bio.html'),
              ('/tools/index.html', '/tools/index.html'),
              ('/qualifier.html', '/qualifier.html'),
              ('/dashboard.html', '/dashboard.html'),
              ('/tools/fund-match-quiz.html', '/tools/fund-match-quiz.html'),
              ('/tools/fundability-score.html', '/tools/fundability-score.html'),
              ('/tools/startup-planner.html', '/tools/startup-planner.html'),
              ('/tools/cost-of-capital.html', '/tools/cost-of-capital.html'),
              ('/dscr-precheck.html', '/dscr-precheck.html'),
              ('/tools/amazon-cashflow.html', '/tools/amazon-cashflow.html'),
              ('/funding/index.html', '/funding/index.html'),
              ('/funding/products.html', '/funding/products.html'),
              ('/verticals/index.html', '/verticals/index.html'),
              ('/verticals/trucking.html', '/verticals/trucking.html'),
              ('/verticals/medical.html', '/verticals/medical.html'),
              ('/verticals/ecommerce.html', '/verticals/ecommerce.html'),
              ('/verticals/contractors.html', '/verticals/contractors.html'),
              ('/verticals/real-estate.html', '/verticals/real-estate.html'),
              ('/solutions/index.html', '/solutions/index.html'),
              ('/solutions/bank-denial.html', '/solutions/bank-denial.html'),
              ('/solutions/payroll-gap.html', '/solutions/payroll-gap.html'),
              ('/solutions/equipment-now.html', '/solutions/equipment-now.html'),
              ('/solutions/zero-revenue.html', '/solutions/zero-revenue.html'),
          ]
          blocks = [marker]
          for route, canonical_path in canonical_routes:
              blocks.append(f'{route}\n  Link: <{new}{canonical_path}>; rel="canonical"\n')
          headers.write_text(base + '\n'.join(blocks).rstrip() + '\n', encoding='utf-8')
          PY

          # This workflow is a one-shot migration helper; remove it from the final repo state.
          rm -f .github/workflows/cloudflare-cutover.yml

          # Fail rather than commit if the old canonical host remains anywhere except git metadata.
          if grep -R --exclude-dir=.git -n "https://fundstack-ai.vercel.app" .; then
            echo "Old canonical host still present"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cut over FundStack canonical hosting to Cloudflare Pages"
          git push
