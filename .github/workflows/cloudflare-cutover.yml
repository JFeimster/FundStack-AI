name: Complete FundStack Cloudflare cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite canonical hosting references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = "https://fundstack-ai.vercel.app"
          new = "https://fundstack.distilledfunding.com"

          # Replace the old canonical hostname everywhere it appears in tracked text files.
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')

          # Bring the README deployment model up to date.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('website deployed on Vercel.', 'website deployed on Cloudflare Pages.')
          text = text.replace('- Vercel hosting with automatic Git deployments disabled.', '- Cloudflare Pages hosting from the `main` branch with `fundstack.distilledfunding.com` as the canonical production domain.')
          text = text.replace('- static headers in `vercel.json`', '- Cloudflare Pages headers and redirects in `_headers` and `_redirects`')
          text = text.replace('3. Preserve `vercel.json` deployment controls.\n4. Do not manually deploy to Vercel without approval.', '3. Preserve `_headers`, `_redirects`, and the legacy `vercel.json` deployment-disable controls.\n4. Do not reactivate or manually deploy the legacy Vercel project.')
          replacement = '''## Deployment Status

Primary production hosting is Cloudflare Pages.

- Canonical production URL: https://fundstack.distilledfunding.com/
- Cloudflare Pages fallback: https://fundstack-ai.pages.dev/
- Production branch: `main`
- Framework preset: `None`
- Build command: blank
- Build output directory: `.`
- DNS: Wix CNAME `fundstack` → `fundstack-ai.pages.dev`
- Legacy Vercel hosting is no longer canonical and remains disabled pending retirement.

`vercel.json` is retained only as a legacy safety/configuration file. Cloudflare Pages uses `_headers` and `_redirects` for the production static-hosting rules.

## Release Process

Changes merged to `main` deploy through the Cloudflare Pages Git integration. Keep related changes grouped, validate the static site, and treat `fundstack.distilledfunding.com` as the production surface.

Release references:

- `docs/deployment-guide.md`
- `docs/release-checklist.md`

## Static SEO and Hosting'''
          text = re.sub(r'## Deployment Status\n.*?\n## Static SEO and Hosting', replacement, text, flags=re.S)
          readme.write_text(text, encoding='utf-8')

          # Replace the obsolete Vercel deployment guide.
          Path('docs/deployment-guide.md').write_text('''# Deployment Guide

This guide documents the production release path for FundStack AI.

## Current Production State

- Canonical production URL: https://fundstack.distilledfunding.com/
- Cloudflare Pages URL: https://fundstack-ai.pages.dev/
- Repository: `JFeimster/FundStack-AI`
- Hosting: Cloudflare Pages
- Production branch: `main`
- Framework preset: `None`
- Build command: blank
- Build output directory: `.`
- Root directory: repository root
- DNS provider: Wix
- DNS record: `fundstack.distilledfunding.com` CNAME → `fundstack-ai.pages.dev`

The legacy Vercel project is not canonical and should remain disabled until it is retired.

## Cloudflare Pages Files

Production hosting behavior is controlled by:

- `_headers` — security, cache, content-type, and canonical Link headers.
- `_redirects` — compatibility redirects for legacy paths.
- `robots.txt` — crawl guidance using the canonical domain.
- `sitemap.xml` — canonical production URLs.
- `data/cta-routing.json` — canonical routing metadata used by the site.

`vercel.json` remains only as a legacy safety/configuration file so an accidental Vercel deployment does not become canonical.

## Release Workflow

1. Make related changes in a coherent commit group.
2. Push or merge to `main`.
3. Cloudflare Pages deploys the repository through its Git integration.
4. Use `fundstack.distilledfunding.com` as the production hostname.
5. If a release fails, inspect the Cloudflare Pages deployment log and fix the repo/build configuration rather than reactivating Vercel.

## Static Site Constraints

FundStack AI is intentionally static-first. Do not add a framework, package manager, server runtime, API route, or authentication layer unless a future product requirement actually needs one.

## Legacy Vercel State

- Previous canonical hostname: `https://fundstack-ai.vercel.app/`
- Automatic Vercel Git deployments remain disabled in `vercel.json`.
- The old Vercel project should be retired after the Cloudflare custom domain is active and serving the current Pages deployment.
''', encoding='utf-8')

          # Replace the obsolete Vercel release checklist.
          Path('docs/release-checklist.md').write_text('''# Release Checklist

Use this checklist for FundStack AI releases on Cloudflare Pages.

## 1. Hosting and Canonical Domain

- [ ] Cloudflare Pages project is connected to `JFeimster/FundStack-AI`.
- [ ] Production branch is `main`.
- [ ] Framework preset is `None`.
- [ ] Build command is blank.
- [ ] Build output directory is `.`.
- [ ] Canonical production domain is `https://fundstack.distilledfunding.com/`.
- [ ] Wix DNS contains `fundstack.distilledfunding.com` CNAME → `fundstack-ai.pages.dev`.

